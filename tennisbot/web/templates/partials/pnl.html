<section id="pnl-panel" hx-get="/partials/pnl" hx-trigger="every 30s" hx-swap="outerHTML">
  <div class="pnl" data-chart='{{ pnl | tojson }}'>
    <div class="pnl-head" aria-live="polite"></div>
    <div class="pnl-plot"></div>
    <div class="pnl-controls">
      <div class="seg pnl-strats" role="group" aria-label="Strategy">
        <button type="button" data-strat="all" aria-pressed="false">All strategies</button>
        {% for s in pnl.strategies %}<button type="button" data-strat="{{ s }}" aria-pressed="false">{{ s }}</button>{% endfor %}
      </div>
      <div class="seg pnl-ranges" role="group" aria-label="Time range">
        {% for r in ["1D", "1W", "1M", "ALL"] %}<button type="button" data-range="{{ r }}" aria-pressed="false">{{ r }}</button>{% endfor %}
      </div>
    </div>
  </div>
  <p class="body-10 t3" style="margin:10px 0 0">Realized paper P&amp;L, net of Kalshi fees. Each step is one closed position (sold or settled). Hover or drag across the chart for the running total at any point.</p>
</section>
