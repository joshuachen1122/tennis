# Fly.io config for the tennis paper-trading agent (separate app from Fifteen's btc-15m-kalshi-agent).
#   fly apps create tennis-kalshi-agent
#   fly volumes create tennis_data_1g --region iad --size 1 -a tennis-kalshi-agent
#   (the volume grows itself up to 3GB; raw data older than 2 days is archived as gzip CSV)
#   secrets: ANTHROPIC_API_KEY, KALSHI_KEY_ID, KALSHI_PRIVATE_KEY, DASHBOARD_PASSWORD (same values as Fifteen)
#   fly deploy
app = "tennis-kalshi-agent"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"
# ~330MB in use at 25 live matches on a 512MB VM; swap covers spikes (e.g. the analyst's report build).
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/tennis.db"
  PORT = "8080"
  LOG_LEVEL = "INFO"
  # Fewer glibc malloc arenas: the database worker threads otherwise fragment memory on the 512MB VM.
  MALLOC_ARENA_MAX = "2"
  # TEMPORARY (2026-11-04): trace allocations to find the memory growth; remove once found.
  PYTHONTRACEMALLOC = "3"
  LLM_MODEL = "claude-opus-5-5"
  LLM_DAILY_BUDGET_USD = "1.0"
  # 24h LLM-gate experiment (research/04): $5/day cap until this time, then back to $1/day.
  LLM_BOOST_DAILY_USD = "5.0"
  LLM_BOOST_UNTIL = "2026-11-05T00:15:00Z"

# SQLite lives on the volume: exactly one machine, never auto-stopped.
[mounts]
  source = "tennis_data_1g"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "3GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
